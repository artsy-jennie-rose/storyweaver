<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryWeaver - AI Audio Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 0; }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        textarea::selection { background-color: #fde047; color: #000; }
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { transition: all 0.3s; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type=range] { accent-color: #4f46e5; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-gray-200 py-4 px-6 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center shadow-sm">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">StoryWeaver</h1>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4 bg-gray-50 p-2 rounded-xl border border-gray-200">
                <div class="flex items-center gap-2 pr-4 border-r border-gray-200">
                    <span class="text-sm font-medium text-gray-600">Smart Voices</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="smart-dialogue-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="smart-dialogue-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>

                <div id="smart-voice-options" style="display: none;" class="items-center gap-3 fade-in flex-wrap">
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-semibold text-blue-600 uppercase tracking-wide">Male</span>
                        <div class="relative">
                            <select id="smart-male-voice" class="appearance-none bg-blue-50 border border-blue-200 text-blue-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-48 py-2 pl-3 pr-8 cursor-pointer shadow-sm outline-none">
                                <option value="default">Loading Voices...</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-blue-600">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-semibold text-pink-600 uppercase tracking-wide">Female</span>
                        <div class="relative">
                            <select id="smart-female-voice" class="appearance-none bg-pink-50 border border-pink-200 text-pink-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-48 py-2 pl-3 pr-8 cursor-pointer shadow-sm outline-none">
                                <option value="default">Loading Voices...</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-pink-600">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                    <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>
                </div>

                <div class="flex items-center gap-2">
                    <span id="narrator-label" class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Voice</span>
                    <div class="relative">
                        <select id="voice-select" class="appearance-none bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-48 py-2 pl-3 pr-8 cursor-pointer shadow-sm outline-none">
                            <option value="default">Loading System Voices...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <button id="tuning-btn" class="ml-1 w-8 h-8 rounded-full bg-white border border-gray-300 text-gray-500 flex items-center justify-center hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300 shadow-sm transition-all" title="Voice Tuning">
                    <i class="fas fa-sliders-h text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-4">
        <div class="flex items-center justify-between mt-2 flex-wrap gap-2">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Story Text / EPUB File</h2>
            <div class="flex gap-2 items-center flex-wrap">
                <input type="file" id="file-upload" accept=".txt,.epub" class="hidden">
                <label for="file-upload" class="cursor-pointer flex items-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 text-sm font-medium py-1.5 px-3 rounded-full shadow-sm hover:bg-indigo-100 transition-all">
                    <i class="fas fa-file-arrow-up"></i> Upload EPUB / TXT
                </label>
                <button id="ai-insights-btn" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-indigo-500 text-white text-sm font-medium py-1.5 px-4 rounded-full shadow hover:shadow-md hover:from-purple-600 hover:to-indigo-600 transition-all">
                    <i class="fas fa-sparkles"></i> AI Insights
                </button>
                <button id="clear-btn" class="flex items-center gap-2 bg-white border border-gray-200 text-red-500 text-sm font-medium py-1.5 px-3 rounded-full shadow-sm hover:bg-red-50 transition-all">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>

        <div id="ai-insights-panel" class="hidden bg-white border border-indigo-100 rounded-xl shadow-sm p-5 fade-in">
            <h3 class="text-lg font-bold text-indigo-900 mb-3 flex items-center gap-2">
                <i class="fas fa-magic text-indigo-500"></i> AI Analysis
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-1">Summary</h4>
                    <p id="insight-summary" class="text-sm text-gray-700 leading-relaxed">Analyzing...</p>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-1">Mood & Tone</h4>
                    <span id="insight-mood" class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded-md font-medium">...</span>
                </div>
            </div>
        </div>

        <div class="flex-grow bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col min-h-[350px]">
            <textarea id="text-input" class="w-full flex-grow p-5 resize-none outline-none text-gray-800 text-lg leading-relaxed placeholder-gray-400 min-h-[300px]" placeholder="Highlight text anywhere or upload an EPUB/TXT file to read..."></textarea>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 sticky bottom-0 z-20 pb-safe">
        <div class="w-full bg-gray-200 h-1.5">
            <div id="progress-fill" class="bg-indigo-600 h-1.5 w-0 transition-all duration-300"></div>
        </div>
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex flex-col">
                    <span id="status-text" class="text-xs font-semibold text-gray-500 uppercase flex items-center gap-1">
                        <i class="fas fa-circle text-[8px] text-green-500"></i> Ready
                    </span>
                    <span class="text-sm text-gray-800 font-medium"><span id="current-progress">0</span> / <span id="total-chunks">0</span> chapters</span>
                </div>
                <div class="relative">
                    <select id="chapter-select" class="appearance-none bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-44 py-2 pl-3 pr-8 cursor-pointer outline-none">
                        <option value="all">Full Story</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                        <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button id="play-btn" class="w-14 h-14 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all transform hover:scale-105 active:scale-95">
                    <i id="play-icon" class="fas fa-play text-xl ml-1"></i>
                </button>
                <div class="flex bg-gray-100 rounded-lg p-1 border border-gray-200">
                    <button class="speed-btn px-3 py-1 text-xs font-medium text-gray-500 rounded-md hover:bg-white hover:text-gray-900 transition-colors" data-speed="0.75">0.75x</button>
                    <button class="speed-btn px-3 py-1 text-xs font-medium bg-white text-indigo-700 shadow-sm rounded-md transition-colors" data-speed="1.0">1x</button>
                    <button class="speed-btn px-3 py-1 text-xs font-medium text-gray-500 rounded-md hover:bg-white hover:text-gray-900 transition-colors" data-speed="1.25">1.25x</button>
                    <button class="speed-btn px-3 py-1 text-xs font-medium text-gray-500 rounded-md hover:bg-white hover:text-gray-900 transition-colors" data-speed="1.5">1.5x</button>
                    <button class="speed-btn px-3 py-1 text-xs font-medium text-gray-500 rounded-md hover:bg-white hover:text-gray-900 transition-colors" data-speed="2.0">2x</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Tuning Modal -->
    <div id="tuning-modal" class="fixed inset-0 bg-black/40 z-50 hidden items-center justify-center backdrop-blur-sm fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-indigo-600"></i> Voice Pitch Tuning
                </h3>
                <button id="close-tuning-btn" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <p class="text-xs text-gray-500 mb-4">Adjust the pitch of voices to make them deeper (lower) or higher (higher).</p>
                
                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-gray-700">Narrator Pitch</label>
                        <span id="pitch-val-narrator" class="text-xs font-medium bg-gray-100 px-2 py-1 rounded text-gray-600">1.0</span>
                    </div>
                    <input type="range" id="pitch-narrator" min="0.1" max="2.0" step="0.1" value="1.0" class="w-full cursor-pointer">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-blue-700">Male Dialogue Pitch</label>
                        <span id="pitch-val-male" class="text-xs font-medium bg-blue-50 px-2 py-1 rounded text-blue-700">1.0</span>
                    </div>
                    <input type="range" id="pitch-male" min="0.1" max="2.0" step="0.1" value="1.0" class="w-full cursor-pointer">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-pink-700">Female Dialogue Pitch</label>
                        <span id="pitch-val-female" class="text-xs font-medium bg-pink-50 px-2 py-1 rounded text-pink-700">1.0</span>
                    </div>
                    <input type="range" id="pitch-female" min="0.1" max="2.0" step="0.1" value="1.0" class="w-full cursor-pointer">
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                <button id="reset-tuning-btn" class="text-sm font-medium text-gray-500 hover:text-gray-700 mr-4">Reset</button>
                <button id="done-tuning-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-6 rounded-lg shadow-sm transition-colors">Done</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            const clearBtn = document.getElementById('clear-btn');
            const textInput = document.getElementById('text-input');
            const fileUpload = document.getElementById('file-upload');
            const chapterSelect = document.getElementById('chapter-select');
            
            const voiceSelect = document.getElementById('voice-select');
            const smartMaleVoiceSelect = document.getElementById('smart-male-voice');
            const smartFemaleVoiceSelect = document.getElementById('smart-female-voice');
            
            const aiInsightsBtn = document.getElementById('ai-insights-btn');
            const aiInsightsPanel = document.getElementById('ai-insights-panel');
            const speedButtons = document.querySelectorAll('.speed-btn');
            const statusText = document.getElementById('status-text');
            const currentProgress = document.getElementById('current-progress');
            const totalChunks = document.getElementById('total-chunks');
            const progressFill = document.getElementById('progress-fill');
            const smartDialogueToggle = document.getElementById('smart-dialogue-toggle');
            const smartVoiceOptions = document.getElementById('smart-voice-options');
            const narratorLabel = document.getElementById('narrator-label');

            const tuningBtn = document.getElementById('tuning-btn');
            const tuningModal = document.getElementById('tuning-modal');
            const closeTuningBtn = document.getElementById('close-tuning-btn');
            const doneTuningBtn = document.getElementById('done-tuning-btn');
            const resetTuningBtn = document.getElementById('reset-tuning-btn');
            
            const pitchNarrator = document.getElementById('pitch-narrator');
            const pitchMale = document.getElementById('pitch-male');
            const pitchFemale = document.getElementById('pitch-female');
            const pitchValNarrator = document.getElementById('pitch-val-narrator');
            const pitchValMale = document.getElementById('pitch-val-male');
            const pitchValFemale = document.getElementById('pitch-val-female');

            let isPlaying = false;
            let isPaused = false;
            let cancelForInterrupt = false; 
            
            let currentSpeed = 1.0;
            let loadedChapters = [];
            let synth = window.speechSynthesis;
            
            let utteranceQueue = [];
            let currentSegmentIndex = 0;
            let currentWordIndex = 0;

            // Chrome silently stops firing speech events (no onend/onerror) once a
            // single utterance runs past ~15s. Periodically nudging pause()/resume()
            // resets that internal timer. The watchdog is a fallback in case a
            // browser still gets stuck despite the nudge.
            let keepAliveTimer = null;
            let watchdogTimer = null;
            let lastBoundaryAt = 0;

            function startKeepAlive() {
                stopKeepAlive();
                lastBoundaryAt = Date.now();
                keepAliveTimer = setInterval(() => {
                    if (synth.speaking && !synth.paused) {
                        synth.pause();
                        synth.resume();
                    }
                }, 10000);
                watchdogTimer = setInterval(() => {
                    if (isPlaying && !isPaused && synth.speaking && Date.now() - lastBoundaryAt > 20000) {
                        // Genuinely stuck: force it forward rather than hang forever.
                        cancelForInterrupt = true;
                        synth.cancel();
                        currentSegmentIndex++;
                        currentWordIndex = 0;
                        speakNextUtterance();
                    }
                }, 5000);
            }

            function stopKeepAlive() {
                if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
                if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
            }

            let pNarrator = 1.0;
            let pMale = 0.85; 
            let pFemale = 1.15; 

            function loadVoices() {
                if (!synth) return;
                let rawVoices = synth.getVoices();
                if (rawVoices && rawVoices.length > 0 && voiceSelect) {
                    voiceSelect.innerHTML = '';
                    smartMaleVoiceSelect.innerHTML = '';
                    smartFemaleVoiceSelect.innerHTML = '';
                    
                    let voices = rawVoices.filter(v => {
                        let l = v.lang.toLowerCase();
                        let n = v.name.toLowerCase();
                        let isEnglish = l.startsWith('en') || n.includes('english') || l.includes('eng');
                        let isNovelty = n.includes("trinoids") || n.includes("zarvox") || n.includes("boing") || n.includes("bubbles") || n.includes("whisper");
                        return isEnglish && !isNovelty;
                    }).map(v => {
                        let score = 0;
                        let n = v.name.toLowerCase();
                        if (n.includes('natural') || n.includes('neural')) score += 150;
                        if (n.includes('premium') || n.includes('enhanced')) score += 120;
                        if (n.includes('google') || !v.localService) score += 100;
                        return { voice: v, score: score };
                    }).sort((a, b) => b.score - a.score);

                    let maleCandidateAdded = false;
                    let femaleCandidateAdded = false;
                    
                    voices.forEach((item) => {
                        let v = item.voice;
                        let n = v.name.toLowerCase();
                        let vNameStr = `${v.name} (${v.lang})`;
                        
                        const opt1 = document.createElement('option');
                        opt1.value = v.name; opt1.textContent = vNameStr;
                        voiceSelect.appendChild(opt1);

                        const isGruffMale = n.includes("david") || n.includes("mark") || n.includes("george") || n.includes("oliver") || n.includes("ryan") || n.includes("stefan") || n.includes("james") || n.includes("guy");
                        const isUpbeatFemale = n.includes("samantha") || n.includes("zira") || n.includes("victoria") || n.includes("karen") || n.includes("siri") || n.includes("jenny") || n.includes("aria") || n.includes("ava") || n.includes("emma");
                        
                        const optMale = document.createElement('option');
                        optMale.value = v.name; optMale.textContent = vNameStr;
                        smartMaleVoiceSelect.appendChild(optMale);
                        if(isGruffMale && !maleCandidateAdded) {
                            smartMaleVoiceSelect.value = v.name;
                            maleCandidateAdded = true;
                        }
                        
                        const optFemale = document.createElement('option');
                        optFemale.value = v.name; optFemale.textContent = vNameStr;
                        smartFemaleVoiceSelect.appendChild(optFemale);
                        if(isUpbeatFemale && !femaleCandidateAdded) {
                            smartFemaleVoiceSelect.value = v.name;
                            femaleCandidateAdded = true;
                        }
                    });
                    
                    if(!maleCandidateAdded && smartMaleVoiceSelect.options.length > 0) smartMaleVoiceSelect.selectedIndex = 0;
                    if(!femaleCandidateAdded && smartFemaleVoiceSelect.options.length > 1) smartFemaleVoiceSelect.selectedIndex = 1;
                }
            }
            
            if (synth.getVoices().length > 0) { loadVoices(); } 
            else if (synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = loadVoices; }

            try {
                const savedText = localStorage.getItem('sw_text');
                const savedChaps = localStorage.getItem('sw_chaps');
                
                const sPN = localStorage.getItem('sw_pitch_n');
                const sPM = localStorage.getItem('sw_pitch_m');
                const sPF = localStorage.getItem('sw_pitch_f');
                
                if (sPN) { pNarrator = parseFloat(sPN); pitchNarrator.value = pNarrator; pitchValNarrator.innerText = pNarrator.toFixed(1); }
                if (sPM) { pMale = parseFloat(sPM); pitchMale.value = pMale; pitchValMale.innerText = pMale.toFixed(1); }
                if (sPF) { pFemale = parseFloat(sPF); pitchFemale.value = pFemale; pitchValFemale.innerText = pFemale.toFixed(1); }

                if (savedChaps) {
                    loadedChapters = JSON.parse(savedChaps);
                    updateChapterDropdown();
                }
                if (savedText && typeof savedText === 'string') {
                    textInput.value = savedText;
                }
            } catch(e) { localStorage.clear(); }

            textInput.addEventListener('input', () => {
                try { localStorage.setItem('sw_text', textInput.value); } catch(e){}
            });

            function openTuning() { tuningModal.classList.remove('hidden'); tuningModal.classList.add('flex'); }
            function closeTuning() { tuningModal.classList.add('hidden'); tuningModal.classList.remove('flex'); }
            
            tuningBtn.addEventListener('click', openTuning);
            closeTuningBtn.addEventListener('click', closeTuning);
            doneTuningBtn.addEventListener('click', closeTuning);
            
            function applyPitchChange() {
                try {
                    localStorage.setItem('sw_pitch_n', pNarrator);
                    localStorage.setItem('sw_pitch_m', pMale);
                    localStorage.setItem('sw_pitch_f', pFemale);
                } catch(e){}
                
                if (isPlaying) {
                     cancelForInterrupt = true;
                     synth.cancel(); 
                     if(!isPaused) speakNextUtterance(); 
                }
            }

            pitchNarrator.addEventListener('input', (e) => { pNarrator = parseFloat(e.target.value); pitchValNarrator.innerText = pNarrator.toFixed(1); });
            pitchNarrator.addEventListener('change', applyPitchChange);
            
            pitchMale.addEventListener('input', (e) => { pMale = parseFloat(e.target.value); pitchValMale.innerText = pMale.toFixed(1); });
            pitchMale.addEventListener('change', applyPitchChange);
            
            pitchFemale.addEventListener('input', (e) => { pFemale = parseFloat(e.target.value); pitchValFemale.innerText = pFemale.toFixed(1); });
            pitchFemale.addEventListener('change', applyPitchChange);

            resetTuningBtn.addEventListener('click', () => {
                pNarrator = 1.0; pMale = 0.85; pFemale = 1.15;
                pitchNarrator.value = 1.0; pitchMale.value = 0.85; pitchFemale.value = 1.15;
                pitchValNarrator.innerText = "1.0"; pitchValMale.innerText = "0.85"; pitchValFemale.innerText = "1.15";
                applyPitchChange();
            });

            function updateChapterDropdown() {
                chapterSelect.innerHTML = '<option value="all">Full Story</option>';
                if (loadedChapters.length > 0) {
                    loadedChapters.forEach((ch, i) => {
                        const opt = document.createElement('option');
                        opt.value = i; opt.textContent = ch.title;
                        chapterSelect.appendChild(opt);
                    });
                    totalChunks.innerText = loadedChapters.length.toString();
                } else {
                    totalChunks.innerText = "0";
                }
            }

            chapterSelect.addEventListener('change', (e) => {
                if (synth) synth.cancel();
                isPlaying = false;
                isPaused = false;
                playIcon.className = "fas fa-play text-xl ml-1";
                const val = e.target.value;
                if (val === 'all') {
                    if (loadedChapters.length > 0) {
                        textInput.value = loadedChapters.map(c => `${c.title}\n\n${c.text}`).join('\n\n---\n\n');
                    }
                    currentProgress.innerText = "0";
                    progressFill.style.width = "0%";
                } else {
                    const idx = parseInt(val, 10);
                    if (loadedChapters[idx]) {
                        textInput.value = loadedChapters[idx].text;
                        currentProgress.innerText = (idx + 1).toString();
                        progressFill.style.width = `${Math.round(((idx + 1) / loadedChapters.length) * 100)}%`;
                    }
                }
            });

            async function extractEpubChapters(file) {
                if (typeof JSZip === 'undefined') throw new Error("JSZip not ready");
                const zip = await JSZip.loadAsync(file);
                let chapters = []; let htmlFiles = [];

                zip.forEach((relPath) => {
                    const l = relPath.toLowerCase();
                    if ((l.endsWith('.html') || l.endsWith('.xhtml') || l.endsWith('.htm')) && !l.includes('nav.') && !l.includes('toc.')) {
                        htmlFiles.push(relPath);
                    }
                });

                htmlFiles.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

                let count = 0;
                for (let p of htmlFiles) {
                    const entry = zip.file(p);
                    if (!entry) continue;
                    const str = await entry.async("string");
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(str, "text/html");
                    doc.querySelectorAll("script, style, nav, header, footer").forEach(el => el.remove());
                    const txt = (doc.body ? doc.body.textContent : doc.textContent || "").replace(/\n\s*\n/g, '\n\n').trim();

                    if (txt.length > 20) {
                        count++;
                        let title = `Chapter ${count}`;
                        const h = doc.querySelector("h1, h2, h3, h4, .title");
                        if (h && h.textContent.trim().length > 0 && h.textContent.trim().length < 60) {
                            title = h.textContent.trim();
                        }
                        chapters.push({ title, text: txt });
                    }
                }
                return chapters;
            }

            if (fileUpload) {
                fileUpload.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    if (synth) synth.cancel();
                    isPlaying = false;
                    isPaused = false;
                    loadedChapters = [];

                    if (file.name.toLowerCase().endsWith('.epub')) {
                        statusText.innerHTML = `<i class="fas fa-spinner fa-spin text-[10px] text-indigo-500"></i> Reading EPUB...`;
                        try {
                            loadedChapters = await extractEpubChapters(file);
                            if (loadedChapters.length > 0) {
                                textInput.value = loadedChapters.map(c => `${c.title}\n\n${c.text}`).join('\n\n---\n\n');
                                updateChapterDropdown();
                                localStorage.setItem('sw_text', textInput.value);
                                localStorage.setItem('sw_chaps', JSON.stringify(loadedChapters));
                                statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-green-500"></i> ${loadedChapters.length} Chapters Loaded!`;
                            } else {
                                throw new Error("No text found");
                            }
                        } catch(err) {
                            statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-red-500"></i> EPUB Error`;
                        }
                    } else {
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            const raw = evt.target.result;
                            textInput.value = raw;
                            const matches = raw.split(/(?=\b(?:Chapter|CHAPTER)\s+\d+)/g);
                            if (matches.length > 1) {
                                loadedChapters = matches.map((ch, i) => ({
                                    title: ch.trim().split('\n')[0].substring(0, 40) || `Chapter ${i + 1}`,
                                    text: ch.trim()
                                }));
                                updateChapterDropdown();
                                localStorage.setItem('sw_chaps', JSON.stringify(loadedChapters));
                            }
                            localStorage.setItem('sw_text', textInput.value);
                            statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-green-500"></i> File Uploaded!`;
                        };
                        reader.readAsText(file);
                    }
                });
            }

            // Clean text specifically for the utterance audio stream (quotes removed, contractions fully expanded)
            function cleanForSpeech(text) {
                return text
                    .replace(/[“”"„‟«»]/g, '') 
                    .replace(/\bthey['’]ll\b/gi, 'they will')
                    .replace(/\bwe['’]ll\b/gi, 'we will')
                    .replace(/\bI['’]ll\b/gi, 'I will')
                    .replace(/\bhe['’]ll\b/gi, 'he will')
                    .replace(/\bshe['’]ll\b/gi, 'she will')
                    .replace(/\byou['’]ll\b/gi, 'you will')
                    .replace(/\bit['’]ll\b/gi, 'it will')
                    .replace(/\bthey['’]re\b/gi, 'they are')
                    .replace(/\bwe['’]re\b/gi, 'we are')
                    .replace(/\byou['’]re\b/gi, 'you are')
                    .replace(/\bI['’]m\b/gi, 'I am')
                    .replace(/\bthey['’]ve\b/gi, 'they have')
                    .replace(/\bwe['’]ve\b/gi, 'we have')
                    .replace(/\byou['’]ve\b/gi, 'you have')
                    .replace(/\bI['’]ve\b/gi, 'I have')
                    .replace(/\bhe['’]d\b/gi, 'he would')
                    .replace(/\bshe['’]d\b/gi, 'she would')
                    .replace(/\bthey['’]d\b/gi, 'they would')
                    .replace(/\bwe['’]d\b/gi, 'we would')
                    .replace(/\bI['’]d\b/gi, 'I would')
                    .replace(/\bcan['’]t\b/gi, 'cannot')
                    .replace(/\bwon['’]t\b/gi, 'will not')
                    .replace(/\bshan['’]t\b/gi, 'shall not')
                    .replace(/\bdon['’]t\b/gi, 'do not')
                    .replace(/\bdoesn['’]t\b/gi, 'does not')
                    .replace(/\bdidn['’]t\b/gi, 'did not')
                    .replace(/\bisn['’]t\b/gi, 'is not')
                    .replace(/\baren['’]t\b/gi, 'are not')
                    .replace(/\bwasn['’]t\b/gi, 'was not')
                    .replace(/\bweren['’]t\b/gi, 'were not')
                    .replace(/\bhasn['’]t\b/gi, 'has not')
                    .replace(/\bhaven['’]t\b/gi, 'have not')
                    .replace(/\bhadn['’]t\b/gi, 'had not')
                    .replace(/\bwouldn['’]t\b/gi, 'would not')
                    .replace(/\bshouldn['’]t\b/gi, 'should not')
                    .replace(/\bcouldn['’]t\b/gi, 'could not')
                    .replace(/\bmightn['’]t\b/gi, 'might not')
                    .replace(/\bmustn['’]t\b/gi, 'must not')
                    .replace(/\bit['’]s\b/gi, 'it is')
                    .replace(/\bthat['’]s\b/gi, 'that is')
                    .replace(/\bwhat['’]s\b/gi, 'what is')
                    .replace(/\bwho['’]s\b/gi, 'who is')
                    .replace(/\bwhere['’]s\b/gi, 'where is')
                    .replace(/\bwhen['’]s\b/gi, 'when is')
                    .replace(/\bwhy['’]s\b/gi, 'why is')
                    .replace(/\bhow['’]s\b/gi, 'how is')
                    .replace(/\blet['’]s\b/gi, 'let us')
                    .replace(/[‘’`ʼ']/g, ''); // Safely remove remaining apostrophes without inserting spaces
            }

            function parseDialogueSegments(fullText) {
                // Parse segments using the exact original text so character indices match textarea 1:1
                const regex = /([^"“”]+)|(["“”][^"“”]+["“”])/g;
                let match;
                let segments = [];
                const malePronouns = /\b(he|him|his|man|boy|gentleman|sir|father|brother|son|uncle|king|prince)\b/i;
                const femalePronouns = /\b(she|her|hers|woman|girl|lady|madam|mother|sister|daughter|aunt|queen|princess)\b/i;
                let lastGender = 'unknown';

                while ((match = regex.exec(fullText)) !== null) {
                    let rawText = match[0];
                    let startIndex = match.index;
                    
                    if (match[1]) {
                        let maleHints = (rawText.match(malePronouns) || []).length;
                        let femaleHints = (rawText.match(femalePronouns) || []).length;
                        if (maleHints > femaleHints) lastGender = 'male';
                        else if (femaleHints > maleHints) lastGender = 'female';
                        
                        segments.push({ 
                            text: rawText, // Keep original text for index tracking
                            type: 'narrator', 
                            startIndex: startIndex, 
                            length: rawText.length 
                        });
                    } else if (match[2]) {
                        let peekGender = lastGender; 
                        let peekIndex = regex.lastIndex;
                        let peekText = fullText.substring(peekIndex, peekIndex + 80);
                        
                        if (/^\s*[,.]?\s*(she|her|the woman|the girl|the lady|mom|mother)/i.test(peekText)) {
                            peekGender = 'female';
                        } else if (/^\s*[,.]?\s*(he|him|his|the man|the boy|the gentleman|dad|father)/i.test(peekText)) {
                            peekGender = 'male';
                        } else {
                            if(peekGender === 'unknown') {
                                peekGender = (segments.filter(s => s.type !== 'narrator').length % 2 === 0) ? 'female' : 'male';
                            }
                        }
                        
                        segments.push({ 
                            text: rawText, // Keep original text for index tracking
                            type: peekGender, 
                            startIndex: startIndex, 
                            length: rawText.length 
                        });
                        lastGender = peekGender;
                    }
                }
                
                if (segments.length === 0 && fullText.trim().length > 0) {
                    segments.push({ 
                        text: fullText, 
                        type: 'narrator', 
                        startIndex: 0, 
                        length: fullText.length 
                    });
                }
                
                return segments;
            }

            function getSegmentFromCursor(cursorPos, segments) {
                for (let i = 0; i < segments.length; i++) {
                    let seg = segments[i];
                    if (cursorPos >= seg.startIndex && cursorPos <= seg.startIndex + seg.length) {
                        return { segmentIndex: i, wordOffset: cursorPos - seg.startIndex };
                    }
                }
                return { segmentIndex: 0, wordOffset: 0 };
            }

            function speakNextUtterance() {
                if (!isPlaying || isPaused || currentSegmentIndex >= utteranceQueue.length) {
                    if (currentSegmentIndex >= utteranceQueue.length && utteranceQueue.length > 0) {
                        if (synth) synth.cancel();
                        stopKeepAlive();
                        isPlaying = false;
                        isPaused = false;
                        playIcon.className = "fas fa-play text-xl ml-1";
                        textInput.readOnly = false;
                        statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-green-500"></i> Finished`;
                    }
                    return;
                }

                let segment = utteranceQueue[currentSegmentIndex];
                let subText = segment.text.substring(currentWordIndex);
                let spokenText = cleanForSpeech(subText); // Expand contractions and remove quotes at utterance level
                
                if (!spokenText.trim()) {
                    currentSegmentIndex++;
                    currentWordIndex = 0;
                    speakNextUtterance();
                    return;
                }

                // Fixed base offset for THIS utterance only — onboundary must not
                // accumulate on top of an already-updated currentWordIndex.
                let utteranceStartIndex = currentWordIndex;

                let utter = new SpeechSynthesisUtterance(spokenText);
                utter.rate = currentSpeed;
                
                let selectedVoiceName;
                if (smartDialogueToggle.checked) {
                    if (segment.type === 'male') {
                        selectedVoiceName = smartMaleVoiceSelect.value;
                        utter.pitch = pMale;
                    }
                    else if (segment.type === 'female') {
                        selectedVoiceName = smartFemaleVoiceSelect.value;
                        utter.pitch = pFemale;
                    }
                    else {
                        selectedVoiceName = voiceSelect.value;
                        utter.pitch = pNarrator;
                    }
                } else {
                    selectedVoiceName = voiceSelect.value;
                    utter.pitch = pNarrator;
                }

                const voices = synth.getVoices();
                const selectedV = voices.find(v => v.name === selectedVoiceName);
                if (selectedV) utter.voice = selectedV;

                utter.onstart = () => {
                    // Not every voice fires onboundary, so also mark activity here
                    // to avoid the watchdog firing on a perfectly healthy long line.
                    lastBoundaryAt = Date.now();
                };

                utter.onboundary = (e) => {
                    if (e.name !== 'word') return;
                    // Set (not accumulate) from the fixed utterance start offset.
                    currentWordIndex = utteranceStartIndex + e.charIndex;
                    lastBoundaryAt = Date.now();
                };

                utter.onend = () => {
                    if (cancelForInterrupt) { cancelForInterrupt = false; return; }
                    currentSegmentIndex++;
                    currentWordIndex = 0;
                    speakNextUtterance();
                };
                
                utter.onerror = () => {
                    if (cancelForInterrupt) { cancelForInterrupt = false; return; }
                    currentSegmentIndex++;
                    currentWordIndex = 0;
                    speakNextUtterance();
                };

                synth.speak(utter);
            }

            if (playBtn) {
                playBtn.addEventListener('click', () => {
                    const txt = textInput.value.trim();
                    if (!txt) return;

                    if (isPlaying) {
                        if (isPaused) {
                            utteranceQueue = parseDialogueSegments(textInput.value);
                            let cursorPos = textInput.selectionStart;
                            if (cursorPos !== undefined && cursorPos > 0) {
                                let target = getSegmentFromCursor(cursorPos, utteranceQueue);
                                currentSegmentIndex = target.segmentIndex;
                                currentWordIndex = target.wordOffset;
                            }

                            isPaused = false;
                            textInput.readOnly = true; 
                            playIcon.className = "fas fa-pause text-xl";
                            statusText.innerHTML = `<i class="fas fa-spinner fa-spin text-[10px] text-indigo-500"></i> Reading`;
                            startKeepAlive();
                            speakNextUtterance();
                        } else {
                            cancelForInterrupt = true;
                            synth.cancel();
                            stopKeepAlive();
                            isPaused = true;
                            textInput.readOnly = false; 
                            playIcon.className = "fas fa-play text-xl ml-1";
                            statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-yellow-500"></i> Paused`;
                        }
                    } else {
                        if (synth) synth.cancel();
                        isPlaying = true;
                        isPaused = false;
                        cancelForInterrupt = false;
                        textInput.readOnly = true; 
                        
                        utteranceQueue = parseDialogueSegments(textInput.value);
                        
                        let cursorPos = textInput.selectionStart;
                        if (cursorPos !== undefined && cursorPos > 0) {
                            let target = getSegmentFromCursor(cursorPos, utteranceQueue);
                            currentSegmentIndex = target.segmentIndex;
                            currentWordIndex = target.wordOffset;
                        } else {
                            currentSegmentIndex = 0;
                            currentWordIndex = 0;
                        }

                        playIcon.className = "fas fa-pause text-xl";
                        statusText.innerHTML = `<i class="fas fa-spinner fa-spin text-[10px] text-indigo-500"></i> Reading`;
                        startKeepAlive();
                        speakNextUtterance();
                    }
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (synth) synth.cancel();
                    stopKeepAlive();
                    isPlaying = false;
                    isPaused = false;
                    cancelForInterrupt = false;
                    textInput.value = '';
                    textInput.readOnly = false;
                    loadedChapters = [];
                    chapterSelect.innerHTML = '<option value="all">Full Story</option>';
                    localStorage.removeItem('sw_text');
                    localStorage.removeItem('sw_chaps');
                    aiInsightsPanel.classList.add('hidden');
                    progressFill.style.width = '0%';
                    currentProgress.innerText = '0';
                    totalChunks.innerText = '0';
                    statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-green-500"></i> Cleared`;
                });
            }

            if (aiInsightsBtn) {
                aiInsightsBtn.addEventListener('click', () => {
                    if (!textInput.value.trim()) return;
                    aiInsightsBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Analyzing...`;
                    setTimeout(() => {
                        aiInsightsPanel.classList.remove('hidden');
                        document.getElementById('insight-summary').innerText = `Story text contains ${loadedChapters.length || 1} chapter(s) with rich narrative structure and clear dialogue formatting.`;
                        document.getElementById('insight-mood').innerText = "Immersive & Engaging";
                        aiInsightsBtn.innerHTML = `<i class="fas fa-sparkles"></i> AI Insights`;
                    }, 800);
                });
            }

            if (smartDialogueToggle) {
                smartDialogueToggle.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        smartVoiceOptions.style.display = 'flex';
                        narratorLabel.innerText = "Narrator";
                    } else {
                        smartVoiceOptions.style.display = 'none';
                        narratorLabel.innerText = "Voice";
                    }
                    if (isPlaying) {
                        cancelForInterrupt = true;
                        synth.cancel();
                        if(!isPaused) speakNextUtterance();
                    }
                });
            }

            speedButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    speedButtons.forEach(b => {
                        b.classList.remove('bg-white', 'text-indigo-700', 'shadow-sm');
                        b.classList.add('text-gray-500');
                    });
                    const t = e.currentTarget;
                    t.classList.remove('text-gray-500');
                    t.classList.add('bg-white', 'text-indigo-700', 'shadow-sm');
                    currentSpeed = parseFloat(t.getAttribute('data-speed'));
                    
                    if (isPlaying) {
                         cancelForInterrupt = true;
                         synth.cancel(); 
                         if(isPaused){
                             statusText.innerHTML = `<i class="fas fa-circle text-[8px] text-yellow-500"></i> Paused (Speed updated)`;
                         } else {
                             speakNextUtterance(); 
                         }
                    }
                });
            });
        });
    </script>
</body>
